name: Setup Qt6 + OpenCV
description: Install Qt6 (install-qt-action) and OpenCV for the current runner, then export QT_PREFIX_PATH / OPENCV_DIR to GITHUB_ENV. Shared by the build/test/release workflows.

inputs:
  qt-version:
    description: Qt6 version to install
    required: false
    default: '6.8.3'
  opencv-version-win:
    description: OpenCV version for the Windows runner (official vc14_vc15 build). Pinned to 4.10.0 — the MediaPipe vision.dll binds opencv_world<ver>0.dll and MSIX copies opencv DLLs from the same C:\opencv; keep them in sync.
    required: false
    default: '4.10.0'
  vulkan-version-win:
    description: LunarG Vulkan SDK version for the Windows runner (compile coverage for the Vulkan backend)
    required: false
    default: '1.4.304.1'
  mediapipe-win:
    description: Restore (or cold-build) the MediaPipe C API prebuilt at build/mediapipe/install (Windows only). Disable for jobs that don't need real mediapipe plugins.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        cache: true

    - name: Export QT_PREFIX_PATH
      shell: bash
      run: |
        # install-qt-action 老版本导出 Qt6_DIR=<prefix>/lib/cmake/Qt6（前缀在
        # 三层之上）；新版本只导出 QT_ROOT_DIR=<prefix> 本身。两者都试，
        # 并以 lib/cmake/Qt6 存在性校验，避免空变量 dirname 出 "." 污染下游
        # （package_linux.py 会因 QT_PREFIX_PATH=. 报「Qt6 未找到」）。
        qt_prefix="${Qt6_DIR:-${QT6_DIR:-}}"
        if [ -n "$qt_prefix" ]; then
          qt_prefix="$(dirname "$qt_prefix")"
          qt_prefix="$(dirname "$qt_prefix")"
          qt_prefix="$(dirname "$qt_prefix")"
        else
          qt_prefix="${QT_ROOT_DIR:-}"
        fi
        if [ -n "$qt_prefix" ] && [ ! -d "$qt_prefix/lib/cmake/Qt6" ]; then
          qmake_bin="$(command -v qmake6 || command -v qmake || true)"
          if [ -n "$qmake_bin" ]; then qt_prefix="$(dirname "$qmake_bin")/.."; fi
        fi
        if [ -z "$qt_prefix" ] || [ ! -d "$qt_prefix/lib/cmake/Qt6" ]; then
          echo "::error::无法定位 Qt 前缀（Qt6_DIR/QT_ROOT_DIR/qmake 均无效）" >&2
          exit 1
        fi
        echo "QT_PREFIX_PATH=$qt_prefix" >> "$GITHUB_ENV"
        echo "QT_PREFIX_PATH=$qt_prefix"

    - name: Install OpenCV (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install opencv

    - name: Install OpenCV + Qt runtime libs + Vulkan dev (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libopencv-dev \
          libvulkan-dev \
          libcurl4-openssl-dev \
          libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
          libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 \
          libxcb-xfixes0

    - name: Cache Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      id: vulkan-cache
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        # 尾缀含义：-rt = 带运行期 loader；-ifw = 官方静默安装器布局（<ver>/ 子目录）
        key: vulkan-sdk-win-${{ inputs.vulkan-version-win }}-rt-ifw-3

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ver = "${{ inputs.vulkan-version-win }}"
        $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan-sdk.exe"
        Write-Host "Downloading $url"
        curl.exe -L --fail --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\vulkan-sdk.exe" $url
        if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed: $LASTEXITCODE" }
        # 安装器是 Qt Installer Framework：用 LunarG 官方文档的静默参数
        # （wgpu 同款）。注意 --accept-messages 与 --default-answer 互斥
        # （同时传会打印 usage 退出），只用 default-answer。
        # copy_only=1 = 只拷文件不写注册表。此前误用 BitRock 的
        # --mode unattended 会报 Unknown option 并弹 GUI 挂死无头 CI；
        # 也不要走 7z 解压 SFX 的捷径（依赖容器内部布局，且 >=1.4.313.1
        # 的 runtime 需要安装器落地）。
        Write-Host "Installing to C:\VulkanSDK\$ver (Qt IFW unattended, copy_only)"
        & "$env:RUNNER_TEMP\vulkan-sdk.exe" --root "C:\VulkanSDK\$ver" --accept-licenses --default-answer --confirm-command install copy_only=1
        if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer failed: $LASTEXITCODE" }
        Remove-Item "$env:RUNNER_TEMP\vulkan-sdk.exe" -Force

        # 运行期加载器：libtask_graph.dll 依赖 vulkan-1.dll，而 runner 的
        # Windows Server 镜像不带（无 GPU），测试进程会 0xc0000135
        # (DLL_NOT_FOUND)。1.4.304.1 未发布 Runtime 组件包，取同系列
        # 1.4.304.0 的（加载器向后兼容）；拷入 <ver>\Bin（export 步骤
        # 探测到版本目录后会把该 Bin 加进 PATH）。
        $rt = "https://sdk.lunarg.com/sdk/download/1.4.304.0/windows/VulkanRT-1.4.304.0-Components.zip"
        curl.exe -L --fail --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\vulkanrt.zip" $rt
        if ($LASTEXITCODE -ne 0) { throw "VulkanRT download failed: $LASTEXITCODE" }
        7z x "$env:RUNNER_TEMP\vulkanrt.zip" -o"$env:RUNNER_TEMP\vulkanrt" -y "VulkanRT-1.4.304.0-Components/x64/*.dll" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "VulkanRT extract failed: $LASTEXITCODE" }
        New-Item -ItemType Directory -Force -Path "C:\VulkanSDK\$ver\Bin" | Out-Null
        Copy-Item "$env:RUNNER_TEMP\vulkanrt\VulkanRT-1.4.304.0-Components\x64\*.dll" "C:\VulkanSDK\$ver\Bin\" -Force
        Remove-Item "$env:RUNNER_TEMP\vulkanrt.zip","$env:RUNNER_TEMP\vulkanrt" -Recurse -Force -ErrorAction SilentlyContinue

    - name: Export Vulkan SDK env (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # 7z 解压布局是 C:\VulkanSDK\Include\...（无版本子目录）；
        # 兼容保留版本子目录布局的探测（若改回安装器方式安装）。
        $dir = $null
        if (Test-Path "C:\VulkanSDK\Include\vulkan\vulkan.h") {
          $dir = Get-Item "C:\VulkanSDK"
        } else {
          $dir = Get-ChildItem -Path "C:\VulkanSDK" -Directory -Recurse -Depth 1 -ErrorAction SilentlyContinue |
              Where-Object { Test-Path "$($_.FullName)\Include\vulkan\vulkan.h" } |
              Sort-Object FullName -Descending | Select-Object -First 1
        }
        if (-not $dir) {
          throw "vulkan.h not found under C:\VulkanSDK (extract failed?)"
        }
        Write-Host "Vulkan SDK dir: $($dir.FullName)"
        Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$($dir.FullName)"
        if (Test-Path "$($dir.FullName)\Bin") {
          Add-Content -Path $env:GITHUB_PATH -Value "$($dir.FullName)\Bin"
        }
        Write-Host "VULKAN_SDK=$($dir.FullName)"

    - name: Cache OpenCV (Windows)
      if: runner.os == 'Windows'
      id: opencv-cache
      uses: actions/cache@v4
      with:
        path: C:\opencv
        key: opencv-win-${{ inputs.opencv-version-win }}-1

    - name: Download + extract OpenCV (Windows)
      if: runner.os == 'Windows' && steps.opencv-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ver = "${{ inputs.opencv-version-win }}"
        # 官方 Windows 包名自 4.6 起为 opencv-<ver>-windows.exe（旧的 *-vc14_vc15.exe 已 404），
        # 自解压后布局为 opencv/build/x64/vcXX，vcXX 由下方 detect 步骤动态识别。
        $url = "https://github.com/opencv/opencv/releases/download/$ver/opencv-$ver-windows.exe"
        Write-Host "Downloading $url"
        $tmp = "$env:RUNNER_TEMP\opencv.exe"
        Invoke-WebRequest -Uri $url -OutFile $tmp
        Write-Host "Extracting to C:\opencv"
        7z x $tmp -o"C:\" -y | Out-Null

    - name: Detect + export OpenCV dir (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # 官方预编译把 OpenCVConfig.cmake 直接放在 <vcXX>\lib\ 下；vcXX 取实际存在的那一个
        # （vc14_vc15 包含 vc14/vc15，较新版本可能还含 vc16/vc17）。
        $vcDir = Get-ChildItem -Path "C:\opencv\build\x64" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path "$($_.FullName)\lib\OpenCVConfig.cmake" } |
            Sort-Object Name -Descending | Select-Object -First 1
        if (-not $vcDir) {
          throw "OpenCVConfig.cmake not found under C:\opencv\build\x64\*\lib\"
        }
        $vcPath = $vcDir.FullName
        Write-Host "OpenCV vc dir: $vcPath"
        # deps.find_opencv() 读 OPENCV_DIR 并检查 lib 子目录；脚本随后传 -DOpenCV_DIR=<dir>\lib
        Add-Content -Path $env:GITHUB_ENV -Value "OPENCV_DIR=$vcPath"
        Add-Content -Path $env:GITHUB_PATH -Value "$vcPath\bin"

    # ---- MediaPipe C API 预构建（Windows）----
    # install/ 约 11MB（vision.dll + vision.lib + 头文件）；冷构建为全量 bazel
    # （~3600 action，4 核 runner 约 1.5~3h），仅在缓存 miss 时发生。
    # 依赖上方 OpenCV 步骤（C:\opencv 必须就位）。bazel 输出基（C:\bzl，20GB+）
    # 刻意不缓存：超出 GH 10GB/repo 配额，且 key 变化后命中价值低。
    - name: Cache MediaPipe prebuilt (Windows)
      if: runner.os == 'Windows' && inputs.mediapipe-win == 'true'
      id: mediapipe-cache
      uses: actions/cache@v4
      with:
        path: build/mediapipe/install
        # opencv 版本进 key：vision.dll 的导入表绑定 opencv_world<ver>0.dll，
        # OpenCV 升级必须连带重建；hashFiles 覆盖 MP_VERSION 与全部补丁/flag。
        # 刻意不设 restore-keys：版本错配的旧 DLL 比冷构建更危险。
        key: mediapipe-win-${{ inputs.opencv-version-win }}-${{ hashFiles('scripts/build_mediapipe.py') }}

    - name: Build MediaPipe C API (cold cache)
      if: runner.os == 'Windows' && inputs.mediapipe-win == 'true'
         && steps.mediapipe-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # composite 步骤不支持 timeout-minutes，靠 job 级默认 360min 兜底。
        # JDK 走脚本内探测（tools/jdk 缺失时用 JAVA_HOME_21_X64/17_X64）。
        python scripts/build_mediapipe.py --bazel-user-root C:/bzl
