name: Website

# 官网（GitHub Pages）：docs/ 下的 Hugo 站点构建 + 官方 Pages Actions 部署。
# - 站点源码在 docs/；tests/graphstudio-build 的 paths-ignore 已豁免 docs/**，
#   纯站点改动不会触发三端编译 CI。
# - 监听 release: published —— 新版本发布后自动重建站点，下载页/更新日志即时刷新
#   （数据由 scripts/fetch_releases.py 在构建期从 GitHub API 拉取）。
# - WASM 在线体验：release.yml 的 wasm job 把 GraphStudio-*-web.zip 附到 Release，
#   scripts/fetch_web_release.py 在 hugo 构建后下载最新 web zip 解压进
#   docs/public/web/，部署后即 /web/ 在线运行（无 Web 资产时落地页降级空态）。
# - PR 只构建不部署；gh-pages 分支不需要，部署走 actions/deploy-pages。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/fetch_releases.py'
      - 'scripts/fetch_web_release.py'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/fetch_releases.py'
      - 'scripts/fetch_web_release.py'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  # Release workflow 用 job 的 GITHUB_TOKEN 创建 Release，GitHub 的防递归
  # 规则使 release:published 事件不会触发新 workflow（实测不生效）。改用
  # workflow_run 链式触发（不受该规则限制），成功时才重建站点。
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (Hugo)
    # workflow_run 在 Release 失败时也会 fire，仅在成功后重建站点
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 不递归：plugin-* 私有子模块与站点无关（无 deploy key 拉不到会直接失败），
          # 主题子模块是公有仓库，下面单独按需拉取。

      - name: Fetch Hugo theme (PaperMod)
        shell: bash
        run: |
          # 只初始化 docs/themes/PaperMod（https 公有仓库，无需凭证）
          git submodule update --init -- docs/themes/PaperMod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Fetch GitHub Releases data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_releases.py
        # 拉取失败时脚本写空数据、退出 0 —— 站点降级为空态，不阻塞构建

      # 两阶段：hugo 前只写 docs/data/web.json（落地页模板要读）；
      # hugo 后 --unpack-only 把 zip 解进产物目录（不经 static/，避免
      # --minify 改写 Qt shell 与二次拷贝）。/web/ 只放应用，
      # 落地页在 /online/，互不覆盖。
      - name: Fetch web release data (pre-hugo)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_web_release.py --data-only

      - name: Build site
        working-directory: docs
        run: hugo --minify --gc

      - name: Unpack web release (post-hugo)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_web_release.py --unpack-only
        # 失败/无资产时退出 0，不阻塞部署

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
