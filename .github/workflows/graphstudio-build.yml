name: GraphStudio Build

# 三端 GraphStudio 编译验证：构建 task_graph 根库 + subnode 插件 + graph_studio 应用，
# 确认完整应用链路在 macOS / Windows / Linux 上可编译（不含打包/发布，详见 release.yml）。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/website.yml'
      - 'scripts/fetch_releases.py'
      - 'scripts/fetch_web_release.py'
      - 'scripts/package_web.py'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/website.yml'
      - 'scripts/fetch_releases.py'
      - 'scripts/fetch_web_release.py'
      - 'scripts/package_web.py'
  workflow_dispatch:

concurrency:
  group: gs-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # headless Qt + 不在编译验证阶段下载 mediapipe 模型（其测试会 soft-SKIP）
  QT_QPA_PLATFORM: 'offscreen'
  # Windows runner 默认 cp1252，脚本输出的中文会导致 UnicodeEncodeError
  PYTHONUTF8: '1'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]

    steps:
      # 主仓库是公有仓库；四个 plugin-* 子模块是私有仓库，GITHUB_TOKEN 拉不到，
      # 由 fetch-private-submodules 用只读 deploy key 单独拉取。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch private submodules
        uses: ./.github/actions/fetch-private-submodules
        with:
          keys: ${{ secrets.SUBMODULES_DEPLOY_KEYS }}

      - name: Setup Qt6 + OpenCV
        uses: ./.github/actions/setup-build-deps
        # composite action 内部步骤不支持 timeout-minutes，在此兜底。
        # 上限需容纳 MediaPipe 冷构建（缓存 miss 时全量 bazel，约 1.5~3h；
        # Vulkan SDK 下载+安装 <10min，常规命中缓存时整个步骤 <15min）。
        timeout-minutes: 300

      # MNN 推理引擎（外置源码构建）。缓存命中时跳过；Windows 失败不阻塞
      # （应用以 stub 降级——MSVC Debug/Release 运行库不匹配由门控处理）。
      - name: Restore MNN engine cache
        uses: actions/cache@v4
        with:
          path: build/mnn/install
          key: mnn-engine-${{ runner.os }}-${{ hashFiles('scripts/build_mnn.py') }}

      - name: Setup MSVC env (Windows, for MNN Ninja build)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build MNN engine
        shell: bash
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: python scripts/build_mnn.py -j 3

      # wgpu-native 预构建（默认 GPU 后端；钉版本 release zip）。缓存命中时
      # 跳过下载，run_graph_studio.py 的幂等 fetch 复用产物。
      - name: Restore wgpu-native cache
        uses: actions/cache@v4
        with:
          path: build/wgpu/install
          key: wgpu-native-${{ runner.os }}-${{ hashFiles('scripts/fetch_wgpu.py') }}

      - name: Configure + build GraphStudio stack (RelWithDebInfo)
        shell: bash
        run: |
          python scripts/run_graph_studio.py --build-only --config RelWithDebInfo -j 3 --mnn

      - name: Verify build artifact exists
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -d "app/graph_studio/build/graph_studio.app"
            echo "OK: graph_studio.app present"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            test -f "app/graph_studio/build/RelWithDebInfo/graph_studio.exe"
            echo "OK: graph_studio.exe present"
          else
            test -f "app/graph_studio/build/graph_studio"
            echo "OK: graph_studio present"
          fi
