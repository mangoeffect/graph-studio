name: Tests

# 三端 run_all_test：构建根库 + 子模块测试 + GraphStudio UI 测试，分阶段跑 ctest。
# 复用 scripts/run_all_test.py 的「单根构建 + 多阶段 ctest」编排。
# mediapipe 测试在缺少模型时自动 soft-SKIP；GPU/Metal 测试在无 GPU 的 CI runner 上 soft-SKIP。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/website.yml'
      - 'scripts/fetch_releases.py'
      - 'scripts/fetch_web_release.py'
      - 'scripts/package_web.py'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/website.yml'
      - 'scripts/fetch_releases.py'
      - 'scripts/fetch_web_release.py'
      - 'scripts/package_web.py'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: 'offscreen'
  # Windows runner 默认 cp1252，脚本输出的中文会导致 UnicodeEncodeError
  PYTHONUTF8: '1'

jobs:
  test:
    name: run_all_test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]

    steps:
      # 主仓库是公有仓库；四个 plugin-* 子模块是私有仓库，GITHUB_TOKEN 拉不到，
      # 由 fetch-private-submodules 用只读 deploy key 单独拉取。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch private submodules
        uses: ./.github/actions/fetch-private-submodules
        with:
          keys: ${{ secrets.SUBMODULES_DEPLOY_KEYS }}

      - name: Setup Qt6 + OpenCV
        uses: ./.github/actions/setup-build-deps
        # composite action 内部步骤不支持 timeout-minutes，在此兜底。
        # 上限需容纳 MediaPipe 冷构建（缓存 miss 时全量 bazel，约 1.5~3h；
        # Vulkan SDK 下载+安装 <10min，常规命中缓存时整个步骤 <15min）。
        timeout-minutes: 300

      # MNN 推理引擎（外置源码构建，产物约 7~15MB）。缓存命中时跳过；
      # macOS/Linux 全量三端进 ctest，Windows 见下（Release-only 链接）。
      - name: Restore MNN engine cache
        uses: actions/cache@v4
        with:
          path: build/mnn/install
          key: mnn-engine-${{ runner.os }}-${{ hashFiles('scripts/build_mnn.py') }}

      # wgpu-native 预构建（钉版本 release zip，约 30~60MB）。缓存命中时跳过。
      - name: Restore wgpu-native cache
        uses: actions/cache@v4
        with:
          path: build/wgpu/install
          key: wgpu-native-${{ runner.os }}-${{ hashFiles('scripts/fetch_wgpu.py') }}

      # MediaPipe C API（Linux：ubuntu 本机 bazelisk 构建 libvision.so；Windows 走
      # setup-build-deps 内的 mediapipe-win 缓存/构建；macOS 由 run_all_test 按需）。
      # 冷构建约 1.5~3h（全量 bazel + 外部仓库下载），缓存命中时跳过。
      - name: Restore MediaPipe cache (Linux)
        if: runner.os == 'Linux'
        id: mp-cache
        uses: actions/cache@v4
        with:
          path: build/mediapipe/install
          key: mediapipe-linux-${{ hashFiles('scripts/build_mediapipe.py') }}

      - name: Build MediaPipe C API (Linux)
        if: runner.os == 'Linux' && steps.mp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # runner 未预装 bazelisk 时显式下载（钉 v1.19.0，与 Docker 路径一致）
          command -v bazelisk >/dev/null 2>&1 || {
            sudo curl -fsSL \
              https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64 \
              -o /usr/local/bin/bazelisk
            sudo chmod +x /usr/local/bin/bazelisk
          }
          # linux_opencv 仓库指向 /usr 的系统 OpenCV（third_party/opencv_linux.BUILD）
          # gcc-13（PPA）：v1.0.0 api3 的 class NTTP + deleted copy-ctor 在
          # gcc-11/12 与 clang-14(+gcc11/12 头) 下都编不过
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopencv-dev g++-13
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME}}"
          export CC=/usr/bin/gcc-13 CXX=/usr/bin/g++-13
          python3 scripts/build_mediapipe.py -j 3

      # libvision.so 用 gcc-13 构建（上一步注释），而主构建/测试链接用系统
      # gcc-11（libstdc++ ≤3.4.30）：.so 若残留对 GLIBCXX_3.4.31/3.4.32 的
      # 未定义引用，主链所有可执行文件链接期即挂（2026-09-18~21 主仓库 Tests
      # 连红的根因）。build_mediapipe.py 的 -Wl,-Bstatic,-lstdc++,-Bdynamic
      # linkopt 已让 .so 静态自包含（不能用驱动级 -static-libstdc++：bazel 隐式
      # 动态 -lstdc++ 抢先解析，2026-09-24 实测完全失效），此守护把坏档拦截在
      # 链接之前（cache 命中同样校验）。
      - name: Guard libvision GLIBCXX compatibility (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          so="build/mediapipe/install/lib/libvision.so"
          [ -f "$so" ] || { echo "libvision.so 不存在（stub 构建亦正常）——跳过"; exit 0; }
          bad=$(objdump -T "$so" | grep UND | grep -c 'GLIBCXX_3\.4\.3[1-9]' || true)
          if [ "$bad" -gt 0 ]; then
            echo "::error::libvision.so 含 $bad 个对 GLIBCXX_3.4.31+ 的未定义引用——主链 gcc-11 链接必挂。静态 libstdc++ linkopt 失效或缓存坏档；删 mediapipe-linux 缓存重建。"
            exit 1
          fi
          echo "libvision.so 无高版本 GLIBCXX 未定义引用，主链 gcc-11 可链接。"

      # Windows 的 Ninja 需要 cl.exe 在 PATH（vcvars），只影响后续 MNN 构建，
      # 主构建走 VS 生成器不受影响。
      - name: Setup MSVC env (Windows, for MNN Ninja build)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run all tests (framework + submodules + UI)
        shell: bash
        run: |
          # Windows/Linux：下载 MediaPipe 模型与测试图（~35MB——face/matting
          # 的 mediapipe 后端 + 图测试消费；mp_* 任务层已移除但模型保留）；
          # macOS 无本机预构建链路（CI 上 mediapipe 引擎为 stub），下载无意义。
          # --mnn：构建/复用 MNN 引擎（face/matting 后端消费；macOS/Linux Debug
          # 测试真实执行；Windows Debug 与 MNN Release 运行库不匹配（/MDd vs /MD，
          # 同 shaderc），run_all_test 内部构建失败仅告警、不阻塞。
          # TG_TEST_SKIP_GPU：无真实 GPU 的 runner（ubuntu/windows）上 wgpu 落到
          # llvmpipe/WARP 软渲染，init 成功但 compute 提交挂死（实测拖满 6h 平台
          # 上限）——gpu/render 图测试显式软跳过；macOS 有真实 Metal 不设。
          EXTRA=""
          if [ "$RUNNER_OS" != "macOS" ]; then EXTRA="--download-models"; fi
          if [ "$RUNNER_OS" != "macOS" ]; then export TG_TEST_SKIP_GPU=1; fi
          # --no-json-export：UI 阶段以发布配置编译（Save As 仅 tgp）
          python scripts/run_all_test.py -j 3 -v --config Debug $EXTRA --mnn --wgpu --no-json-export

      # 原生后端回归（非阻塞附加项）：gpu/render 测试默认走 wgpu 统一后端
      # （WGSL 单源），这里切回各平台原生后端对照（macOS=Metal / Linux=Vulkan）。
      - name: Native GPU backend regression (non-blocking)
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            TG_GPU_TEST_FORCE_METAL=1 TG_RENDER_TEST_FORCE_METAL=1 \
              ctest -R "test_gpu_image_graph|test_render_graph" --output-on-failure
          else
            TG_RENDER_TEST_FORCE_VULKAN=1 ctest -R "test_render_graph" --output-on-failure
          fi

      - name: Show test summary on failure
        if: failure()
        shell: bash
        run: |
          echo "::notice::run_all_test 阶段汇总见上方日志；若 GPU/Metal 阶段被跳过属预期（无 GPU runner）。"

  # ------------------------------------------------------------------ iOS SDK
  # 交叉编译验证 + 产出 libtask_graph.xcframework（device + simulator 双 slice）。
  # OpenCV（device+sim 两套预编译库）与 MNN 按脚本哈希缓存；缓存命中时构建秒过。
  # CI 中只有 4 个 plugin-* 子模块（render_task 尚无远端仓库，见 AGENTS.md），
  # 移动端打包本就不含 render_task，与本地产物行为一致。
  ios:
    name: ios-sdk (xcframework)
    runs-on: macos-14
    # 上限需容纳全冷路径：OpenCV device+sim（各 ~25-40min）+ MNN iOS + 双 slice 构建
    timeout-minutes: 180
    steps:
      # 主仓库是公有仓库；四个 plugin-* 子模块是私有仓库，GITHUB_TOKEN 拉不到，
      # 由 fetch-private-submodules 用只读 deploy key 单独拉取。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch private submodules
        uses: ./.github/actions/fetch-private-submodules
        with:
          keys: ${{ secrets.SUBMODULES_DEPLOY_KEYS }}

      - name: Restore OpenCV iOS cache
        uses: actions/cache@v4
        with:
          path: |
            build_ios/opencv/install
            build_ios_sim/opencv/install
          key: opencv-ios-${{ hashFiles('scripts/build_opencv_ios.sh') }}

      # build_opencv_ios.sh 无幂等 sentinel，命中缓存时整体跳过；
      # sim 版复用 device 分支克隆的源码（省一次 shallow clone）
      - name: Build OpenCV iOS device + simulator (on cache miss)
        shell: bash
        run: |
          if [ -f build_ios/opencv/install/lib/libopencv_core.a ] && \
             [ -f build_ios_sim/opencv/install/lib/libopencv_core.a ]; then
            echo "OpenCV iOS cached, skip build"
          else
            ./scripts/build_opencv_ios.sh
            ./scripts/build_opencv_ios.sh --sim build_ios/opencv/opencv-src
          fi

      - name: Restore MNN iOS cache
        uses: actions/cache@v4
        with:
          path: build_ios/mnn/install
          key: mnn-ios-${{ hashFiles('scripts/build_mnn.py') }}

      # 失败即失败（与桌面 tests.yml 的 --mnn 口径一致）；build_mnn.py 有幂等
      # sentinel，缓存命中时快速返回
      - name: Build MNN iOS (on cache miss)
        shell: bash
        run: python3 scripts/build_mnn.py --platform ios -j 3

      # MediaPipe C API iOS 静态库（build_ios.sh 内的 ensure 步骤为 warn-tolerant，
      # 这里显式前置 + 失败即失败，保证 CI 上 mp_* 任务真实编入而非 stub）
      - name: Restore MediaPipe iOS cache
        uses: actions/cache@v4
        with:
          path: build_ios/mediapipe/install
          key: mediapipe-ios-${{ hashFiles('scripts/build_mediapipe.py') }}

      - name: Build MediaPipe iOS (on cache miss)
        shell: bash
        run: python3 scripts/build_mediapipe.py --platform ios -j 3

      - name: Build iOS SDK (device + simulator xcframework)
        shell: bash
        run: ./scripts/build_ios.sh -j 3

      - name: Verify xcframework slices
        shell: bash
        run: |
          test -d dist/ios/libtask_graph.xcframework/ios-arm64
          test -d dist/ios/libtask_graph.xcframework/ios-arm64-simulator
          ls -lh dist/ios/libtask_graph.xcframework/ios-arm64/libtask_graph_full.a \
                 dist/ios/libtask_graph.xcframework/ios-arm64-simulator/libtask_graph_full.a

      - name: Upload iOS SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sdk
          path: dist/ios/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Android SDK
  # NDK 交叉编译验证 + 产出 dist/android/arm64-v8a/libtask_graph.a。
  # NDK 用 runner 预装（ANDROID_NDK 只读环境变量，gs.android 不做默认路径探测）；
  # ANDROID_SDK_ROOT 是 OpenCV Android 探测的硬性要求。
  android:
    name: android-sdk (arm64-v8a)
    runs-on: ubuntu-22.04
    # 上限需容纳全冷路径：OpenCV Android + MNN Android + 核心库/子模块构建
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch private submodules
        uses: ./.github/actions/fetch-private-submodules
        with:
          keys: ${{ secrets.SUBMODULES_DEPLOY_KEYS }}

      - name: Locate preinstalled Android NDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ndk="$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ndk" ]; then
            echo "::error::runner 上未找到预装 NDK（$sdk/ndk/ 为空）" >&2
            exit 1
          fi
          echo "ANDROID_NDK=$ndk"       >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk"  >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk"      >> "$GITHUB_ENV"
          echo "NDK: $ndk"

      - name: Restore OpenCV Android cache
        uses: actions/cache@v4
        with:
          path: build_android/opencv/install
          key: opencv-android-${{ hashFiles('scripts/build_opencv_android.py') }}

      # 产出 OpenCV 官方 Android SDK 布局（sdk/native/{jni,staticlibs,3rdparty}）
      - name: Build OpenCV Android (on cache miss)
        shell: bash
        run: |
          if [ -f build_android/opencv/install/sdk/native/staticlibs/arm64-v8a/libopencv_core.a ]; then
            echo "OpenCV Android cached, skip build"
          else
            python3 scripts/build_opencv_android.py -j 4
          fi

      - name: Restore MNN Android cache
        uses: actions/cache@v4
        with:
          path: build_android/mnn/install
          key: mnn-android-${{ hashFiles('scripts/build_mnn.py') }}

      - name: Build MNN Android (on cache miss)
        shell: bash
        run: python3 scripts/build_mnn.py --platform android --abis arm64-v8a -j 4

      # MediaPipe C API Android 静态库（build_android.py 内的 ensure 步骤为
      # warn-tolerant，这里显式前置 + 失败即失败，保证 CI 上 mp_* 真实编入）
      - name: Restore MediaPipe Android cache
        uses: actions/cache@v4
        with:
          path: build_android/mediapipe/install
          key: mediapipe-android-arm64-v8a-${{ hashFiles('scripts/build_mediapipe.py') }}

      - name: Build MediaPipe Android (on cache miss)
        shell: bash
        run: |
          command -v bazelisk >/dev/null 2>&1 || {
            sudo curl -fsSL \
              https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64 \
              -o /usr/local/bin/bazelisk
            sudo chmod +x /usr/local/bin/bazelisk
          }
          # gcc-13（PPA）：同桌面 Linux 步骤（api3 的 class NTTP 要求）
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq && sudo apt-get install -y -qq libopencv-dev g++-13
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME}}"
          export CC=/usr/bin/gcc-13 CXX=/usr/bin/g++-13
          python3 scripts/build_mediapipe.py --platform android --android-abi arm64-v8a -j 4

      - name: Build Android SDK (arm64-v8a)
        shell: bash
        run: python3 scripts/build_android.py -j 4

      - name: Verify merged archive
        shell: bash
        run: |
          test -f dist/android/arm64-v8a/libtask_graph.a
          test -d dist/android/include/task_graph
          ls -lh dist/android/arm64-v8a/libtask_graph.a

      - name: Upload Android SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk
          path: dist/android/
          if-no-files-found: error
          retention-days: 7
