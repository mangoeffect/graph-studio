# task_graph / GraphStudio 官网（GitHub Pages）
# 站点源码在 docs/，由 .github/workflows/website.yml 构建部署。
# 本地开发：python scripts/fetch_releases.py && hugo server -s docs

baseURL = "https://studio.mangoeffect.net/"
title = "task_graph · GraphStudio"
theme = "PaperMod"
defaultContentLanguage = "zh"
enableRobotsTXT = true
# lastmod 取每文件的 git 提交时间（sitemap <lastmod> 与 JSON-LD dateModified 的来源）。
# 浅克隆下所有文件的时间恒为 HEAD 日期，须配套 website.yml 的 fetch-depth: 0。
enableGitInfo = true
enableEmoji = true
# 中文内容按 CJK 统计字数（阅读时长 / WordCount 正确）
hasCJKLanguage = true

[pagination]
pagerSize = 10

[params]
env = "production"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
displayFullLangName = true
ShowFullTextInRSS = false
ShowWordCount = false
comments = false
mainSections = ["blog"]
# 日期显示为 ISO 风格（主题支持 ":date_long" 等 CLDR 预设）
DateFormat = "2006-01-02"
repoUrl = "https://github.com/mangoeffect/graph-studio"
# meta author 与 JSON-LD BlogPosting.author 的兜底
author = "mangoeffect"
# og:image 兜底（无封面文章的社交分享图；1200x630 横版，社交大卡片规格）
images = ["img/og-image-wide.png"]

# JSON-LD Organization.sameAs（主题 schema_json.html 消费）
[params.schema]
sameAs = ["https://github.com/mangoeffect/graph-studio"]

# 搜索引擎站长验证（PaperMod head.html 消费；需要时取消注释填 token。
# Search Console 也可走 Cloudflare DNS TXT 验证，无需动这里）
# [params.analytics.google]
#   SiteVerificationTag = ""
# [params.analytics.bing]
#   SiteVerificationTag = ""

[params.assets]
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"

[params.label]
icon = "logo.png"
iconHeight = 28
# 页头 logo 区显示短名；<title>/og:site_name 用语言级加长标题（见 languages.*.title）
text = "task_graph · GraphStudio"

[markup]
  [markup.highlight]
    noClasses = true
    style = "monokai"
    codeFences = true
    guessSyntax = true
  [markup.goldmark.renderer]
    # release notes 正文可能包含 HTML（GitHub 自动生成内容）
    unsafe = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
category = "categories"

# ---------------------------------------------------------------- 中文（默认，根路径）
[languages.zh]
locale = "zh-CN"
languageName = "简体中文"
languageCode = "zh-CN"
weight = 1
contentDir = "content/zh"
# 语言级加长标题：首页 <title>/og:site_name 用（含可搜索关键词），
# 内页 <title> 的站名后缀随之加长（页面唯一名在前，截断只吃后缀）
title = "task_graph · GraphStudio — C++20 跨平台 DAG 任务执行框架"

[languages.zh.params]
description = "轻量级、跨平台的 C++20 DAG 任务执行框架，附带 GraphStudio 可视化编辑器"
keywords = ["task_graph", "GraphStudio", "DAG", "C++20", "任务图", "计算图", "插件系统", "GPU"]

